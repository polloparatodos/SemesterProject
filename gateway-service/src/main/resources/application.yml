spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: agent-catalog-service
          uri: lb://agent-catalog-service
          predicates:
            - Path=/api/agents/**
        - id: deployment-service
          uri: lb://deployment-service
          predicates:
            - Path=/api/deployments/**
        - id: customer-service
          uri: lb://customer-service
          predicates:
            - Path=/api/customers/**
        - id: chat-service
          uri: lb://chat-service
          predicates:
            - Path=/api/messages/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://discovery-service:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
