server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://agent-db:5432/${AGENT_DB_NAME}
    username: ${AGENT_DB_USER}
    password: ${AGENT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info