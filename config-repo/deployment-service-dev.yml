server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://deployment-db:5432/${DEPLOYMENT_DB_NAME}
    username: ${DEPLOYMENT_DB_USER}
    password: ${DEPLOYMENT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

auth-service:
  url: http://auth-service:8086

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://discovery-service:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info