services:
  config-service:
    build:
      context: .
      dockerfile: config-service/Dockerfile
    container_name: config-service
    ports:
      - "8888:8888"
    volumes:
      - ./config-repo:/config-repo
    environment:
      SPRING_PROFILES_ACTIVE: native
    networks:
      - agenthub-network

  discovery-service:
    build:
      context: .
      dockerfile: discovery-service/Dockerfile
    container_name: discovery-service
    ports:
      - "8761:8761"
    networks:
      - agenthub-network

  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    container_name: gateway-service
    restart: on-failure
    depends_on:
      - discovery-service
      - config-service
    ports:
      - "8080:8080"
    environment:
      EUREKA_URI: http://discovery-service:8761/eureka
    networks:
      - agenthub-network

  agent-db:
    image: postgres:16
    container_name: agent-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AGENT_DB_NAME}
      POSTGRES_USER: ${AGENT_DB_USER}
      POSTGRES_PASSWORD: ${AGENT_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - agent-db-data:/var/lib/postgresql/data
    networks:
      - agenthub-network

  deployment-db:
    image: postgres:16
    container_name: deployment-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DEPLOYMENT_DB_NAME}
      POSTGRES_USER: ${DEPLOYMENT_DB_USER}
      POSTGRES_PASSWORD: ${DEPLOYMENT_DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - deployment-db-data:/var/lib/postgresql/data
    networks:
      - agenthub-network

  customer-db:
    image: postgres:16
    container_name: customer-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CUSTOMER_DB_NAME}
      POSTGRES_USER: ${CUSTOMER_DB_USER}
      POSTGRES_PASSWORD: ${CUSTOMER_DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - customer-db-data:/var/lib/postgresql/data
    networks:
      - agenthub-network

  auth-db:
    image: postgres:16
    container_name: auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "5436:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - agenthub-network

  chat-mongodb:
    image: mongo:7.0
    container_name: chat-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    ports:
      - "27017:27017"
    volumes:
      - chat-mongodb-data:/data/db
    networks:
      - agenthub-network

  agent-catalog-service:
    build:
      context: .
      dockerfile: agent-catalog-service/Dockerfile
    container_name: agent-catalog-service
    restart: on-failure
    depends_on:
      - config-service
      - discovery-service
      - agent-db
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: ${APP_PROFILE:-dev}
      SPRING_CONFIG_IMPORT: configserver:http://config-service:8888
      AGENT_DB_NAME: ${AGENT_DB_NAME}
      AGENT_DB_USER: ${AGENT_DB_USER}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      EUREKA_URI: http://discovery-service:8761/eureka
    networks:
      - agenthub-network

  deployment-service:
    build:
      context: .
      dockerfile: deployment-service/Dockerfile
    container_name: deployment-service
    restart: on-failure
    depends_on:
      - config-service
      - discovery-service
      - deployment-db
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: ${APP_PROFILE:-dev}
      SPRING_CONFIG_IMPORT: configserver:http://config-service:8888
      DEPLOYMENT_DB_NAME: ${DEPLOYMENT_DB_NAME}
      DEPLOYMENT_DB_USER: ${DEPLOYMENT_DB_USER}
      DEPLOYMENT_DB_PASSWORD: ${DEPLOYMENT_DB_PASSWORD}
      EUREKA_URI: http://discovery-service:8761/eureka
    networks:
      - agenthub-network

  customer-service:
    build:
      context: .
      dockerfile: customer-service/Dockerfile
    container_name: customer-service
    restart: on-failure
    depends_on:
      - config-service
      - discovery-service
      - customer-db
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: ${APP_PROFILE:-dev}
      SPRING_CONFIG_IMPORT: configserver:http://config-service:8888
      CUSTOMER_DB_NAME: ${CUSTOMER_DB_NAME}
      CUSTOMER_DB_USER: ${CUSTOMER_DB_USER}
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD}
      EUREKA_URI: http://discovery-service:8761/eureka
    networks:
      - agenthub-network

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    restart: on-failure
    depends_on:
      - config-service
      - discovery-service
      - auth-db
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: ${APP_PROFILE:-dev}
      SPRING_CONFIG_IMPORT: configserver:http://config-service:8888
      AUTH_DB_NAME: ${AUTH_DB_NAME}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      EUREKA_URI: http://discovery-service:8761/eureka
    networks:
      - agenthub-network

  chat-service:
    build:
      context: .
      dockerfile: chat-service/Dockerfile
    container_name: chat-service
    restart: on-failure
    depends_on:
      - config-service
      - discovery-service
      - chat-mongodb
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: ${APP_PROFILE:-dev}
      SPRING_CONFIG_IMPORT: configserver:http://config-service:8888
      MONGO_DB_NAME: ${MONGO_DB_NAME}
      MONGO_ROOT_USER: ${MONGO_ROOT_USER}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      EUREKA_URI: http://discovery-service:8761/eureka
    networks:
      - agenthub-network

volumes:
  agent-db-data:
  deployment-db-data:
  customer-db-data:
  auth-db-data:
  chat-mongodb-data:

networks:
  agenthub-network:
    driver: bridge
